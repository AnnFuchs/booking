server {
    listen 80;
    server_name team3.ddns.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name team3.ddns.net;

    resolver 127.0.0.11 valid=30s;

    ssl_certificate /etc/letsencrypt/live/team3.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team3.ddns.net/privkey.pem;
    client_max_body_size 20M;

    location /api/v1/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /media/ {
        alias /media/;
        expires 7d;
    }
}
